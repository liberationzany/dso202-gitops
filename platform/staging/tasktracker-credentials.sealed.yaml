# Descriptor : Unit IV 4.3.1 - delivered by platform-staging; Unit I 1.2.5 - Secrets
# Purpose    : The database credentials of the staging environment, encrypted with
#              the public key of this cluster's Sealed Secrets controller.
#              Generated with kubeseal (Task 4, step 4) - do not edit by hand.
#              Safe to commit: only that controller's private key (backed up
#              outside the repository) can decrypt it. Strict scope: the name
#              and namespace are part of the encryption, so this file is
#              useless in any other namespace or under any other name.
# Generate   : kubectl create secret generic tasktracker-credentials #                --namespace dso202-staging --from-env-file=secrets-plain/staging.env #                --dry-run=client -o yaml | kubeseal --format yaml
# =============================================================================
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: tasktracker-credentials
  namespace: dso202-staging
spec:
  encryptedData:
    DB_PASSWORD: 
    DB_USER: 
    POSTGRES_PASSWORD: 
    POSTGRES_USER: 
  template:
    metadata:
      name: tasktracker-credentials
      namespace: dso202-staging
