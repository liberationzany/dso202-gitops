# =============================================================================
# File       : environments/dev/values.yaml
# Assignment : DSO202 Assignment 4
# Descriptor : Unit III 3.2 - values per environment; Unit IV 4.3.1
# Purpose    : Everything that differs in dev. Read by tasktracker-dev, which
#              follows the main branch, so every merge here is deployed.
# =============================================================================
existingSecret: tasktracker-credentials

database:
  image:
    tag: "1.0"

backend:
  image:
    tag: "1.1"
  replicas: 1
  service:
    # Mapped to the host by cluster/kind-cluster.yaml, so the browser can call
    # the API at http://localhost:30082 (the frontend has no /api proxy).
    type: NodePort
    nodePort: 30082

frontend:
  image:
    tag: "1.1"
  replicas: 1
  backendUrl: http://localhost:30082
  service:
    type: NodePort
    nodePort: 30080           # mapped to http://localhost:30080
