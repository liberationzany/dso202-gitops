{{- /*
=============================================================================
File       : charts/tasktracker/templates/serviceaccounts.yaml
Assignment : DSO202 Assignment 4
Descriptor : Unit II 2.3 - one ServiceAccount per workload
Purpose    : An identity per tier, with no API permissions and no mounted
             token (from Assignment 2). ServiceAccount is a namespaced kind
             in the dso202 project's whitelist; Roles are not, so the chart
             cannot grant these accounts anything.
=============================================================================
*/}}
{{- range $component := list "frontend" "backend" "db" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tasktracker.fullname" $ }}-{{ $component }}
  labels:
    {{- include "tasktracker.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
automountServiceAccountToken: false
{{- end }}
