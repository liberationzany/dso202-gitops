apiVersion: v2
name: tasktracker
description: >-
  Three-tier Task Tracker (nginx frontend, Node/Express backend, PostgreSQL
  StatefulSet), delivered by Argo CD. Renders only the namespaced kinds the
  dso202 AppProject permits; credentials, namespaces, quotas and RBAC belong
  to the platform layer.
type: application
# The chart version changes whenever a template changes. Image versions are
# NOT tied to it: they are values (contract C1), so a release is a values
# commit, not a chart release.
version: 0.4.0
appVersion: "1.0"
